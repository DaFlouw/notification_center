[project]
name = "notification-center"
version = "1.1.3"
description = "Zentrales, lokales Benachrichtigungs- und Ereignissystem fuer Home Assistant"
requires-python = ">=3.13"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  "hass: Test benoetigt die Home-Assistant-Testumgebung (laeuft nur unter Linux/CI)",
  "echter_datenbankpfad: Test prueft den echten Pfad der Ereignisdatenbank",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
