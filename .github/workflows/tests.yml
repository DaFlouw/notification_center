name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests

  unit:
    name: Domaenentests (Stufe 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/unit -m "not hass"

  integration:
    name: Home-Assistant-Tests (Stufe 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Home Assistant 2026.8 setzt Python 3.14.2 voraus.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-test.txt
      # Die Ausgabe wird zusaetzlich als Annotation gemeldet: Job-Logs sind nur
      # mit Admin-Rechten abrufbar, Annotationen dagegen oeffentlich lesbar.
      - name: Integrationstests
        run: |
          if pytest tests/integration -q --tb=short > pytest.log 2>&1; then
            cat pytest.log
          else
            cat pytest.log
            tail -n 25 pytest.log | while IFS= read -r zeile; do
              printf '::error::%s
' "$zeile"
            done
            exit 1
          fi

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS-Validierung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Die Marken-Pruefung verlangt einen Eintrag in home-assistant/brands,
          # den es fuer eine neue eigene Integration nicht gibt.
          ignore: brands
